<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablety</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header>
  <h1>Tablety</h1>
  <span class="links"><span id="st-ha" class="pill">HA</span><span id="st-mqtt" class="pill">MQTT</span></span>
</header>
<nav>
  <button class="tab active" data-tab="msg">Wiadomość</button>
  <button class="tab" data-tab="list">Lista tabletów</button>
  <button class="tab" data-tab="cfg">Konfiguracja</button>
</nav>

<main>
<!-- Wiadomość -->
<section id="tab-msg" class="tab-body active">
  <div class="card">
    <label class="row">Do:
      <select id="target"></select>
    </label>
    <div class="rec-wrap">
      <button id="rec" class="rec" type="button">
        <span class="rec-icon">●</span>
        <span id="rec-label">Nagraj wiadomość</span>
      </button>
      <button id="rec-cancel" class="link hidden" type="button">Anuluj nagranie</button>
      <div id="rec-info" class="muted"></div>
    </div>
    <div class="row text-row">
      <input id="text" type="text" maxlength="500" placeholder="Wpisz komunikat - tablety przeczytają go głosem">
      <button id="send-text" class="primary" type="button">Wyślij</button>
    </div>
    <div id="quick" class="quick"></div>
    <label class="check"><input id="force" type="checkbox"> Wyślij mimo warunku <span id="cond" class="muted"></span></label>
    <div id="result" class="result"></div>
  </div>
  <div class="card">
    <h2>Ostatnie wiadomości</h2>
    <ul id="history" class="history"></ul>
  </div>
</section>

<!-- Lista tabletów -->
<section id="tab-list" class="tab-body">
  <div id="tablets" class="tablets"></div>
</section>

<!-- Konfiguracja -->
<section id="tab-cfg" class="tab-body">
  <div class="card">
    <div class="row space"><h2>Tablety</h2><button id="add" class="primary" type="button">Dodaj tablet</button></div>
    <table class="cfg-table"><thead><tr><th>Nazwa</th><th>Adres IP</th><th>Miejsce</th><th>Model</th><th>Głos</th><th>Format</th><th></th></tr></thead>
    <tbody id="cfg-tablets"></tbody></table>
  </div>

  <form id="tablet-form" class="card hidden" autocomplete="off">
    <h2 id="form-title">Tablet</h2>
    <div class="grid">
      <label>Nazwa<input name="name" required maxlength="40"></label>
      <label>Adres IP<input name="ip" required placeholder="192.168.10.247"></label>
      <label>Miejsce<input name="place" maxlength="40" placeholder="Pokój dzieci"></label>
      <label>Model<input name="model" maxlength="40" placeholder="Galaxy Tab 3 10.1"></label>
      <label>Format dźwięku tabletu<select name="audio_format" id="formats"></select></label>
      <label class="check"><input type="checkbox" name="voice"> Odczytywanie komunikatów głosowych</label>
    </div>
    <h3>Zasilanie (opcjonalnie)</h3>
    <div class="grid">
      <label>Moc ładowarki (W)<input name="power_entity" list="dl-power" placeholder="sensor.charger_1_power"></label>
      <label>Energia ładowarki (kWh)<input name="energy_entity" list="dl-energy" placeholder="sensor.charger_1_energy"></label>
      <label>Włącznik zasilania<input name="switch_entity" list="dl-switch" placeholder="switch.charger_1"></label>
      <label>Włącz ładowanie poniżej (%)<input name="charge_on_below" type="number" min="0" max="100"></label>
      <label>Wyłącz ładowanie powyżej (%)<input name="charge_off_above" type="number" min="0" max="100"></label>
    </div>
    <p class="muted">Progi 0 - bez sterowania włącznikiem. Bez połączenia z tabletem przez 15 minut włącznik zostaje włączony (tablet mógł się rozładować).</p>
    <div class="row space">
      <span id="form-error" class="error"></span>
      <span><button type="button" id="form-cancel">Anuluj</button> <button type="submit" class="primary">Zapisz</button></span>
    </div>
  </form>

  <form id="settings-form" class="card" autocomplete="off">
    <h2>Ustawienia ogólne</h2>
    <div class="grid">
      <label>Warunek odczytu komunikatów - encja<input name="voice_condition_entity" list="dl-all" placeholder="switch.main_power_switch"></label>
      <label>Wymagany stan encji<input name="voice_condition_state" placeholder="on"></label>
      <label>Silnik mowy (TTS)<input name="tts_engine" list="dl-tts" placeholder="tts.home_assistant_cloud"></label>
      <label>Język mowy<input name="tts_language" placeholder="pl-PL"></label>
    </div>
    <label>Skróty komunikatów (jeden w linii)<textarea name="quick_messages" rows="5"></textarea></label>
    <label>Ekrany tabletów - encje dla komunikatu „get” (JSON: ekran → lista encji)<textarea name="screens" rows="4" class="mono"></textarea></label>
    <div class="row space"><span id="settings-msg" class="muted"></span><button type="submit" class="primary">Zapisz ustawienia</button></div>
  </form>
</section>
</main>

<datalist id="dl-power"></datalist><datalist id="dl-energy"></datalist>
<datalist id="dl-switch"></datalist><datalist id="dl-tts"></datalist><datalist id="dl-all"></datalist>
<script src="static/app.js"></script>
</body>
</html>
